name: Publish website from trinity

# This repository serves the apex, t27.ai. The website's source lives in
# gHashTag/trinity, whose own Pages is https://t27.ai/trinity/ — a different URL
# that nobody visits. So for months "merged, deploy green" and "on the site"
# were two different things, and only one of them had an instrument.
#
# The publisher belongs here rather than in trinity, because this is where the
# write permission is. trinity is public, so checking it out needs no token at
# all: the built-in GITHUB_TOKEN with contents:write is enough to build somebody
# else's public sources and commit the result to this repository.
#
# It publishes only when the content-hashed entry bundle actually changes, so a
# rebuild that produces identical bytes leaves no commit behind.

on:
  schedule:
    # Fifteen minutes is the worst-case lag between a merge in trinity and the
    # apex serving it. The gate in trinity waits that long before going red.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-website.yml'
      - 'regen-blog.py'
      - 'build-og.py'
      - 'build-results.py'
      - 'record-delivery.py'
      - 'fonts/**'

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the apex
        uses: actions/checkout@v4
        with:
          # The whole history, not the default single commit. verify-site.sh
          # checks that every sitemap lastmod agrees with the date git records
          # for that file, and a depth-1 checkout has exactly one commit — so
          # `git log -1 -- gft/index.html` answers with the date of the last
          # publish for every file on the site. From the first publish onward,
          # every honest lastmod older than today read as fabricated, the gate
          # failed, and the publisher stopped pushing while reporting a content
          # problem it had invented. The gate was right about its rule and wrong
          # about the facts, because it was never given them.
          fetch-depth: 0

      - name: Checkout the website sources
        uses: actions/checkout@v4
        with:
          repository: gHashTag/trinity
          ref: main
          path: .src

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pillow draws the OG card for a post that does not have one yet. The
      # cards were hand-written SVG rasterised by qlmanage, which exists only on
      # a Mac, so an unattended publish could never produce one — and
      # verify-site.sh requires og-blog-<slug>.png on disk for every post.
      - name: Card rasteriser
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin

      - name: Build
        working-directory: .src/apps/website
        run: |
          set -euo pipefail
          npm ci --silent 2>/dev/null || npm install --silent
          npm run build

      - name: Publish, but only if the bytes changed
        run: |
          set -uo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "## Publish website" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          SRC_SHA=$(git -C .src rev-parse --short HEAD)
          NEW=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' .src/apps/website/dist/index.html | head -1)
          OLD=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' index.html | head -1)

          # The entry bundle alone is not the site. A change that does not alter
          # its content hash never reached the apex at all: 404.html, robots.txt,
          # the icons and manifest, every code-split chunk, and every prerendered
          # page. On 2026-08-13 a 404.html fix was merged into trinity, this
          # workflow ran four times, reported "already current" each time, and
          # the apex kept serving the file from the day before -- correctly, by
          # the rule as written.
          #
          # So compare a manifest of every built file, not one filename. Names
          # are content-hashed by Vite, and the unhashed statics are covered by
          # hashing their bytes.
          # Only the published surface: the apex checkout also carries .git,
          # .github and repository docs, none of which exist in dist/. Comparing
          # them raw would report a difference on every run and publish forever.
          manifest() {
            ( cd "$1" && find . -type f \
                -not -path './.git/*' -not -path './.github/*' \
                -not -name 'README.md' -not -name 'CNAME' \
              | sort | while read -r f; do
                printf '%s %s\n' "$(sha256sum "$f" | cut -c1-16)" "$f"
              done ) | sha256sum | cut -c1-16
          }
          NEW_TREE=$(manifest .src/apps/website/dist)
          OLD_TREE=$(manifest .)

          # An empty hash is a failure, never a match. A pattern that missed the
          # underscore in Vite hashes once compared an empty string against an
          # empty string here and reported a confident green.
          if [ -z "$NEW" ]; then
            say "- **FAIL** the build produced no entry bundle"
            exit 1
          fi
          if [ -z "$OLD" ]; then
            say "- **FAIL** the committed index.html references no entry bundle"
            exit 1
          fi

          say "- trinity \`$SRC_SHA\` builds \`$NEW\`"
          say "- this repository currently serves \`$OLD\`"

          say "- built tree \`$NEW_TREE\`, served tree \`$OLD_TREE\`"

          if [ "$NEW" = "$OLD" ] && [ "$NEW_TREE" = "$OLD_TREE" ]; then
            say "- **PASS** already current, nothing to publish"
            exit 0
          fi
          if [ "$NEW" = "$OLD" ]; then
            say "- entry bundle unchanged, but other files differ -- publishing"
          fi

          # Additive on purpose. The generated pages (cases/, gft/, about/ …),
          # the OG images and CNAME are not in dist/ and must survive.
          rsync -a .src/apps/website/dist/ ./

          # /cases/ is generated from runs.json, and this copy is a snapshot of
          # trinity's. A snapshot that is never refreshed goes stale silently and
          # the page starts disagreeing with the app it sits beside — which is
          # how it came to claim nothing had finished while ten runs existed.
          # Refreshed from the sources this publish already checked out.
          if [ -f .src/apps/website/src/data/runs.json ]; then
            cp .src/apps/website/src/data/runs.json runs.json
            python3 build-landing.py >/dev/null
            say "- refreshed runs.json from trinity and rebuilt the landing pages"
          else
            say "- **FAIL** trinity has no apps/website/src/data/runs.json — /cases/ would go stale"
            exit 1
          fi

          # The static blog is generated from trinity's posts.ts, and until now
          # that generation was a manual step nobody had wired in. So publishing
          # a new post required a human to remember it, and verify-site.sh —
          # correctly — refused to publish anything at all until they did:
          # between 2026-08-13 15:xx UTC and 2026-08-14, twelve consecutive runs
          # failed on `blog drift: … rerun build-blog.py`, and six merged pull
          # requests unrelated to the blog never reached a reader. A gate whose
          # remedy is manual stops the whole pipeline, not just the part that
          # tripped it.
          # This step runs without `set -e`, so the exit status is read here:
          # a failed regeneration would otherwise fall through to the drift gate
          # and be reported as a content problem instead of a broken generator.
          if ! python3 regen-blog.py .src/apps/website; then
            say "- **FAIL** regen-blog.py could not rebuild the static blog"
            exit 1
          fi

          # Перестраиваем все OG-карточки после SVG блога. Это отдельный вызов
          # с проверкой кода: regen-blog владеет данными постов, а build-og —
          # общей растризацией Inter для новых и ранее созданных карточек.
          if ! python3 build-og.py; then
            say "- **FAIL** build-og.py could not rebuild the Inter OG cards"
            exit 1
          fi

          # /r/ и /status/ строятся из того же runs.json, который импортирует
          # SPA. Страница результата исправляется тем же публикатором, который
          # проверяет и коммитит дерево, а не ждёт ручного запуска.
          if ! RUNS_JSON=.src/apps/website/src/data/runs.json python3 build-results.py; then
            say "- **FAIL** build-results.py could not rebuild result pages"
            exit 1
          fi

          # Записываем измеренную задержку «коммит исходника → публикация» рядом
          # с публичной страницей статуса; скрипт хранит последние 50 событий.
          if ! python3 record-delivery.py .src; then
            say "- **FAIL** record-delivery.py could not write delivery status"
            exit 1
          fi

          # Restamp sitemap lastmod from git, because sitemap.xml is a committed
          # static file with no generator: every publish moves the files it
          # describes and the dates stay where they were written. verify-site.sh
          # asks git directly and rejected the tree with
          #   index.html: sitemap says 2026-08-12, git says 2026-08-13
          # which is correct -- a hand-written date cannot follow a build. Before
          # this, that gate was never reached, because the publisher exited early
          # on "already current" and nothing ever got as far as being verified.
          python3 - <<'PYSM'
          import re, subprocess, datetime, pathlib
          sm = pathlib.Path("sitemap.xml"); t = sm.read_text(encoding="utf-8")

          today = datetime.date.today().isoformat()

          def when(loc):
              # Mirror verify-site.sh exactly, including its dirty rule. The first
              # version of this used the last COMMIT date unconditionally and the
              # verifier still rejected index.html: after rsync the built file
              # differs from HEAD, and for a file the build changed the verifier
              # expects TODAY, not the date of the commit that last touched it.
              # Two implementations of "what git says", disagreeing.
              rel = loc.replace("https://t27.ai/", "") or "index.html"
              f = rel if pathlib.Path(rel).is_file() else str(pathlib.Path(rel) / "index.html")
              if not pathlib.Path(f).is_file():
                  return None
              tracked = subprocess.run(["git","ls-files","--error-unmatch",f],
                                       capture_output=True).returncode == 0
              if not tracked:
                  return today          # a new page: today is right by definition
              dirty = subprocess.run(["git","diff","--quiet","HEAD","--",f],
                                     capture_output=True).returncode
              if dirty:
                  return today
              return subprocess.run(["git","log","-1","--format=%cs","--",f],
                                    capture_output=True, text=True).stdout.strip() or None

          n = 0
          def sub(m):
              global n
              loc, lm = m.group(1), m.group(2)
              d = when(loc) or today
              if d != lm: n += 1
              return m.group(0).replace(f"<lastmod>{lm}</lastmod>", f"<lastmod>{d}</lastmod>")

          t2 = re.sub(r"<loc>([^<]*)</loc>\s*<lastmod>([^<]*)</lastmod>", sub, t)
          sm.write_text(t2, encoding="utf-8")
          print(f"  sitemap: {n} lastmod value(s) restamped from git")
          PYSM

          # The same gate a human publish runs. It fails loudly on empty values
          # rather than treating them as passes, which is the only reason it is
          # worth running unattended.
          if ! ./verify-site.sh --local; then
            say "- **FAIL** verify-site.sh rejected the built tree — nothing pushed"
            exit 1
          fi

          git config user.name  'trinity publisher'
          git config user.email 'admin@t27.ai'
          git add -A
          if git diff --cached --quiet; then
            say "- **PASS** verify passed and no files changed"
            exit 0
          fi
          git commit -q -m "Publish $NEW from trinity $SRC_SHA"
          git push -q
          say "- **PASS** published \`$NEW\` from trinity \`$SRC_SHA\`"
