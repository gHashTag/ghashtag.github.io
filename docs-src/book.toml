[book]
title = "GOLDEN SUNFLOWERS"
description = "PhD on phi-Numerics for Neural Network Training. Anchor: phi^2 + phi^-2 = 3."
authors = ["Dmitrii Vasilev", "Trinity S\u00b3AI Research Group"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/gHashTag/ghashtag.github.io"
edit-url-template = "https://github.com/gHashTag/ghashtag.github.io/edit/main/docs-src/{path}"
additional-css = ["theme/sunflower.css"]
mathjax-support = true
site-url = "/docs/"

[output.html.search]
enable = true
limit-results = 20

[output.html.print]
enable = true
