  <!-- GitHub Pages SPA redirect handler -->
  <script>
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))

<script>
(function mountFlosAureus(){
  function tryMount(){
    var existing = document.getElementById('flos-aureus');
    var hero = document.getElementById('hero');
    var tpl = document.getElementById('flos-aureus-template');
    if(!hero || !tpl) return false;
    // If duplicate exists outside React root (the old appended copy), remove it
    if(existing && existing.parentElement !== hero.parentElement){ existing.remove(); existing = null; }
    if(existing) return true; // already mounted in correct spot
    var clone = tpl.content.cloneNode(true);
    hero.insertAdjacentElement('afterend', clone.querySelector('section'));
    return true;
  }
  if(!tryMount()){
    var n = 0, iv = setInterval(function(){
      n++;
      if(tryMount() || n > 40) clearInterval(iv);
    }, 150);
  }
  // Re-mount on SPA route changes: if React Router re-renders home, our section can be wiped
  var mo = new MutationObserver(function(){
    if(!document.getElementById('flos-aureus')) tryMount();
  });
  if(document.body) mo.observe(document.body, {childList:true, subtree:true});
})();
</script>
