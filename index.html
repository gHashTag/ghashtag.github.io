<style>

<script>
(function mountFlosAureus(){
  function buildPhyllo(host){
    var svg = host.querySelector('#phyllo-dots');
    if(!svg || svg.childNodes.length) return;
    var n=120, c=50, scale=4.0, golden=Math.PI*(3-Math.sqrt(5));
    for(var i=0;i<n;i++){
      var r=scale*Math.sqrt(i), a=i*golden;
      var x=c+r*Math.cos(a), y=c+r*Math.sin(a);
      var dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',x.toFixed(2));dot.setAttribute('cy',y.toFixed(2));
      dot.setAttribute('r',(0.6+i/300).toFixed(2));
      dot.setAttribute('fill','currentColor');dot.setAttribute('stroke','none');
      dot.setAttribute('opacity',(0.35+i/(n*1.6)).toFixed(2));
      svg.appendChild(dot);
    }
  }
  function attachParallax(host){
    var stage = host.querySelector('.flos-stage');
    if(!stage) return;
    var sigils = stage.querySelectorAll('.flos-sigil');
    function onScroll(){
      var rect = stage.getBoundingClientRect();
      var center = window.innerHeight/2;
      var d = (rect.top + rect.height/2 - center) / window.innerHeight;
      sigils.forEach(function(s,i){
        var depth = (i%3+1) * 14;
        s.style.setProperty('--px', (d*depth).toFixed(1)+'px');
        s.style.transform = (s.style.transform.replace(/translate3d\([^)]+\) ?/,'')) + ' translate3d(0,'+(d*depth).toFixed(1)+'px,0)';
      });
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  }
  function tryMount(){
    var existing = document.getElementById('flos-aureus');
    var hero = document.getElementById('hero');
    var tpl = document.getElementById('flos-aureus-template');
    if(!hero || !tpl) return false;
    if(existing && existing.parentElement !== hero.parentElement){ existing.remove(); existing = null; }
    if(existing) return true;
    var clone = tpl.content.cloneNode(true);
    var sec = clone.querySelector('section');
    hero.insertAdjacentElement('afterend', sec);
    buildPhyllo(sec);
    attachParallax(sec);
    return true;
  }
  if(!tryMount()){
    var n=0, iv=setInterval(function(){ n++; if(tryMount()||n>40) clearInterval(iv); }, 150);
  }
  var mo = new MutationObserver(function(){
    if(!document.getElementById('flos-aureus')) tryMount();
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
})();
</script>
