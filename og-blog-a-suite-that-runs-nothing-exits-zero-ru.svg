  <text x="80" y="132" font-family="Inter,Helvetica,Arial,sans-serif" font-size="30" fill="#00ff88" letter-spacing="3">T27.AI</text>
  <text x="80" y="248" font-family="Inter,Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#e8f4ef">Ноль из шестисот</text>
