  <line x1="80" y1="412" x2="1120" y2="412" stroke="#1d2b2a" stroke-width="2"/>
  <text x="80" y="486" font-family="Inter,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#00ff88">5</text>
